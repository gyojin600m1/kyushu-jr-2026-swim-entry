name: 速報を自動で取り込む

# 大会中（10/10〜12 の 8:40〜17:50 ごろ）、公式SEIKO種目別結果PDF を1分おきに見て、
# 九州ジュニアの結果が増えていたら index.html と live.json を更新して push する。
# 1回の実行は約50分。20分おきに次の実行が予約されるので、途切れずに見張り続ける。
# 今すぐ取り込みたいときは Actions → この workflow → Run workflow。
on:
  schedule:
    - cron: "40 23 9-11 10 *"      # 日本時間 8:40（10/10〜12）
    - cron: "*/20 0-8 10-12 10 *"  # 日本時間 9:00〜17:40（10/10〜12）
  workflow_dispatch:
    inputs:
      minutes:
        description: "何分見張りますか（1なら1回だけ取り込んで終わる）"
        required: false
        default: "50"

concurrency:
  group: live-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4

      - name: PDF読取を準備
        run: python3 -m pip install "pdfplumber==0.11.7"

      - name: 速報を見張る（約50分）
        env:
          MINUTES: ${{ inputs.minutes || '50' }}
        run: |
          set -u
          git config user.name "live-results-bot"
          git config user.email "actions@users.noreply.github.com"

          END=$(( $(date +%s) + MINUTES * 60 ))
          GAP=180          # push の間隔（秒）。Pages の作り直しが詰まらないように
          LAST_PUSH=0
          MODE=""          # 1回目は全種目、2回目からは今日の種目だけ

          push() {
            git add index.html live.json
            git commit -q -m "速報を反映（$(TZ=Asia/Tokyo date '+%-m/%-d %H:%M')）" || return 0
            if git push -q origin HEAD:main; then
              LAST_PUSH=$(date +%s)
              echo "push しました: $(TZ=Asia/Tokyo date '+%H:%M:%S')"
            else
              echo "push できなかったので、最新を取り直して次の回でやり直します"
              git fetch -q origin main && git reset -q --hard origin/main
            fi
          }

          while [ "$(date +%s)" -lt "$END" ]; do
            # 手元に未 push の変更が無ければ、最新の main に合わせる（人が直した分を取り込む）
            if git diff --quiet; then
              git fetch -q origin main && git reset -q --hard origin/main
            fi
            python3 tools/live_results.py $MODE
            MODE="--today"
            if ! git diff --quiet && [ $(( $(date +%s) - LAST_PUSH )) -ge $GAP ]; then
              push
            fi
            sleep 60
          done
          if ! git diff --quiet; then push; fi
